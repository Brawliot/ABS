global
  maxconn 256
  stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
  mode tcp
  timeout connect 5s
  timeout client 30m
  timeout server 30m

frontend stats
  bind *:8404
  mode http
  stats enable
  stats uri /stats

frontend pg_write
  bind *:5432
  default_backend pg_primary

backend pg_primary
  option httpchk GET /health || true
  server primary pg-primary:5432 check inter 3s fall 3 rise 2
  # Tras failover manual, actualizar este server al nodo promovido
  # (en prod Patroni + HAProxy reconfiguran solos vía template).
