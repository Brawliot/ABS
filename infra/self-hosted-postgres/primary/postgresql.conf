# Configuración mínima de primario para streaming replication + archivo WAL (PITR).
listen_addresses = '*'
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
archive_mode = on
archive_command = 'test ! -f /var/lib/pgbackrest/archive/%f && cp %p /var/lib/pgbackrest/archive/%f'
# Cifrado en tránsito: exigir SSL en prod (ssl = on + certificados).
# Cifrado en reposo: LUKS/dm-crypt o disco cifrado del hipervisor (fuera de PG).
password_encryption = scram-sha-256
log_min_duration_statement = 500
shared_preload_libraries = ''
